# ==========================================================================
# 生产环境配置（application-prod.properties）
#
# 放到 jar 同级的 /opt/lol/config/ 目录下，或 /opt/lol/ 下。
# Spring Boot 会先读 jar 内的 application.properties，再用这个文件覆盖同名项，
# 所以这里只需要写「跟开发环境不一样的那些」。
# ==========================================================================

server.port=8080
# 只监听本机回环。不加这一行默认是 0.0.0.0（ss 里显示 *:8080），
# 等于把所有接口都暴露出去 —— 后端是给 Nginx 从本机反代用的，没有理由对外可见。
# 这样即使安全组被人误开了 8080，外网也连不进来。
server.address=127.0.0.1

# ---- 数据库 ----
# 账号密码换成你自己的。注意别用 root，也别用 123456 这种
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lol?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useLocalSessionState=true&useLocalTransactionState=true&alwaysSendSetIsolation=false&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true
spring.datasource.username=lol
spring.datasource.password=改成你的强密码
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 第一次启动用 update：项目里没有 SQL 建表脚本，靠它自动生成全部表。
# 表建好、确认数据正常之后，建议改成 validate ——
# 生产环境让应用自己改表结构，出问题的代价太大。
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# 必须换。用这条命令生成一个随机串填进来：
#   openssl rand -base64 48
# 改掉它意味着所有人要重新登录一次
jwt.secret=换成随机生成的长字符串
jwt.expire=86400000

# ---- Redis ----
# 只缓存，不做持久化。挂了服务照常能用，只是慢一点
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# ---- 上传文件 ----
# 必须写成绝对路径，且和 nginx 配置里 /uploads/ 的 alias 指向同一个目录。
# 相对路径会落在 systemd 的 WorkingDirectory 里，换台机器就找不着了。
app.upload.dir=/var/lib/lol/uploads
app.upload.image-max-mb=5
app.upload.video-max-mb=20
app.upload.avatar-max-mb=2
app.upload.protect-minutes=30

# Spring Boot 默认单文件上限只有 1MB，视频根本传不进来
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
