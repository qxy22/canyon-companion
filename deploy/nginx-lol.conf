# ==========================================================================
# LOL 战绩交友系统 · Nginx 站点配置
#
# 放到 /etc/nginx/conf.d/lol.conf，然后：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 三件事必须做对，否则页面能开但用不了：
#   1. /api/   反向代理到本机 8080（后端只监听 127.0.0.1，不对外）
#   2. /ws/    必须带 Upgrade 头，否则房间聊天连不上（握手会 400）
#   3. try_files 回退到 index.html，否则刷新 /player/3 这种子路由直接 404
# ==========================================================================

upstream lol_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    # 换成你的域名或 ECS 公网 IP。没域名就填 IP，多个用空格隔开
    server_name _;

    server_tokens off;

    # 前端构建产物。dist 里的东西直接放这个目录下
    root /var/www/lol-web;
    index index.html;

    # 与后端 spring.servlet.multipart.max-file-size=25MB 对齐。
    # 这里小了，传视频会在 nginx 这一层就被挡掉，返回 413
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------------
    # 聊天/头像上传的文件：直接由 nginx 读盘，不必绕道 JVM。
    # 这里的目录必须和 application-prod.properties 里的 app.upload.dir 一致
    # ---------------------------------------------------------------------
    location /uploads/ {
        # SELinux 开着时，这个目录必须是 httpd_sys_rw_content_t（Nginx 读、Java 写），
        # 用只读的 httpd_sys_content_t 会让上传全部失败
        alias /var/lib/lol/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        # 图片视频的 200 日志刷屏，关掉
        access_log off;
    }

    # ---------------------------------------------------------------------
    # 接口
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://lol_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 空串而不是默认的 close，才能复用 upstream 里的 keepalive 连接
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------
    # WebSocket：房间聊天
    #
    # 这两行是重点：HTTP/1.1 + Connection: upgrade 缺一不可，
    # 少了它们 nginx 会把升级请求当普通 HTTP 转发出去，浏览器端握手报 400。
    # ---------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://lol_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 长连接，别让 nginx 60 秒就把聊天掐了
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------------
    # 前端静态资源：文件名带 hash，可以放心长缓存
    # ---------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 入口文件不缓存，否则发新版后用户还停在旧页面
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------------------------------------------------------------------
    # 桌面客户端安装包（网页顶栏「下载客户端」指向的就是这里）
    #
    # 文件放在前端 root 下面的 download/，所以这里不用 alias —— alias 配
    # try_files 会踩 $uri 重复拼接的坑（明明文件在，却 404）。
    #
    # try_files ... =404 这一句不是可选的：没有它，安装包万一丢了，请求会被
    # 最下面那条 location / 兜到 index.html，用户点下载得到一个 HTML 文件。
    # ---------------------------------------------------------------------
    location /download/ {
        try_files $uri =404;
        # 安装包 100MB 上下，默认 60 秒会把慢速下载掐断
        send_timeout 300s;
        # 发新版是覆盖同一个文件，所以不缓存，否则用户拿到的还是旧包
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # history 模式路由：/player/3、/teamup/5 这些路径磁盘上没有对应文件，
    # 一律回退给 index.html 交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
